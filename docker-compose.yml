services:
  seccheck:
    # To use the prebuilt image instead of building locally, replace
    # "build: ." with: image: ghcr.io/chrizzo84/selfhost-seccheck:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Scan history, targets and notification settings (SQLite). A named
      # volume keeps the permissions of the non-root container user.
      - seccheck-data:/app/data
    environment:
      # Set to 1 when the scanner is reachable from the internet, so it
      # cannot be abused to probe your internal network.
      SECCHECK_BLOCK_PRIVATE: "0"
      # SECCHECK_LANG: "de"       # default language for the CLI and scheduled scans
      # GITHUB_TOKEN: ""          # optional, raises the rate limit for version/advisory lookups
      # NVD_API_KEY: ""           # optional, faster CVE feed sync
      # SECCHECK_CVE_SYNC_HOURS: "2"  # CVE feed update interval, 0 = only on request
      # SECCHECK_CA_BUNDLE: /certs/ca.pem   # trust an internal CA
      # SECCHECK_SCHEDULER: "0"   # disable scheduled scans
    restart: unless-stopped

volumes:
  seccheck-data:
