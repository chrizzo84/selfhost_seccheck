[project]
name = "selfhost-seccheck"
version = "0.1.0"
description = "Security checks for self-hosted software (Nextcloud, Vaultwarden, Immich, ...) with a web UI, grading, history and notifications."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "chrizzo84" }]
requires-python = ">=3.12"
keywords = ["security", "self-hosted", "scanner", "tls", "nextcloud", "homelab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "dnspython>=2.6",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Full cipher-suite enumeration via sslyze (pins an older cryptography).
full = ["sslyze>=6"]

[project.urls]
Homepage = "https://github.com/chrizzo84/selfhost-seccheck"
Issues = "https://github.com/chrizzo84/selfhost-seccheck/issues"
Changelog = "https://github.com/chrizzo84/selfhost-seccheck/blob/main/CHANGELOG.md"

[project.scripts]
seccheck = "seccheck.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seccheck*"]

[tool.setuptools.package-data]
seccheck = ["locales/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode (–, →) is intended in user-facing text
    "RUF002",
    "RUF003",
    "B008",    # FastAPI dependency defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
