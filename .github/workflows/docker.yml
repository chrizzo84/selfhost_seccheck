name: Docker

# Builds the container image and pushes it to the GitHub Container Registry.
#
#   push to main      -> ghcr.io/<owner>/<repo>:edge, :sha-<commit>
#   tag v1.2.3        -> :1.2.3, :1.2, :latest
#   pull request      -> build and smoke test only, nothing is pushed

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # Registry paths must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=SelfHost SecCheck
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: seccheck:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name seccheck -p 8000:8000 seccheck:smoke-test
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/apps >/dev/null && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/apps | grep -q '"nextcloud"'
          curl -fs -H 'Accept-Language: de' http://127.0.0.1:8000/api/categories | grep -q 'Zertifikat'
          curl -fs http://127.0.0.1:8000/ | grep -q 'SelfHost SecCheck'
          docker exec seccheck python -c "from seccheck.core import cipherscan; assert cipherscan.AVAILABLE, 'sslyze missing'"

      # The first thing you need when the smoke test fails.
      - name: Container log
        if: always()
        run: docker logs seccheck || true

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
