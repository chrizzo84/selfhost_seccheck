name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev,full]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t selfhost-seccheck:ci .
      - name: Smoke test
        run: |
          docker run -d --name seccheck -p 8000:8000 selfhost-seccheck:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/apps >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/apps | grep -q nextcloud
          docker rm -f seccheck
